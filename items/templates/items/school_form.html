{% extends 'items/base.html' %}
{% block title %}School Form{% endblock %}
{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %} School</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a href="{% url 'school-list' %}">Cancel</a>
</form>
{% endblock %}
