{% extends 'items/base.html' %}
{% block title %}Schools{% endblock %}
{% block content %}
<h1>Schools</h1>
<a class="btn" href="{% url 'school-add' %}">+ Add School</a>
<table>
    <thead>
        <tr><th>Name</th><th>Address</th><th>Actions</th></tr>
    </thead>
    <tbody>
    {% for school in schools %}
        <tr>
            <td>{{ school.name }}</td>
            <td>{{ school.address }}</td>
            <td class="actions">
                <a href="{% url 'school-edit' school.pk %}">Edit</a>
                <a href="{% url 'school-delete' school.pk %}">Delete</a>
            </td>
        </tr>
    {% empty %}
        <tr><td colspan="3">No schools yet.</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
