{% extends 'items/base.html' %}
{% block title %}Student Form{% endblock %}
{% block content %}
<h1>{% if object %}Edit{% else %}Add{% endif %} Student</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn" type="submit">Save</button>
    <a href="{% url 'student-list' %}">Cancel</a>
</form>
{% endblock %}
