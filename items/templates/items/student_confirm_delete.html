{% extends 'items/base.html' %}
{% block title %}Delete Student{% endblock %}
{% block content %}
<h1>Delete Student</h1>
<p>Are you sure you want to delete "{{ object }}"?</p>
<form method="post">
    {% csrf_token %}
    <button class="btn" type="submit">Yes, delete</button>
    <a href="{% url 'student-list' %}">Cancel</a>
</form>
{% endblock %}
